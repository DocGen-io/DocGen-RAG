version: '3.4'

services:
  weaviate:
    # Updated to the latest stable Weaviate release
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.8
    container_name: docgen-weaviate
    ports:
      - 8080:8080
      - 50051:50051
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      # Since your pipelines use Haystack's SentenceTransformersTextEmbedder, 
      # Weaviate doesn't need to run its own text vectorization modules internally!
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  weaviate_data:
