[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "docgen-rag"
version = "0.1.0"
description = "A RAG-based documentation generator"
authors = [
    { name = "Ali Hasan", email = "ali1saleem1hasan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "haystack-ai",
    "weaviate-haystack",
    "gitpython",
    "pydantic-settings",
    "pyyaml",
    "python-multipart",
    "pytest",
    "httpx",
    "arize-phoenix>=4.0.0",
    "openinference-instrumentation-haystack",
    "ollama-haystack",
    "google-genai-haystack",
    "tree-sitter",
    "tree-sitter-language-pack",
    "gitignore-parser>=0.1.13",
    "scikit-learn",
    "numpy",
    "openapi-spec-validator",
    "ragas>=0.4.3",
    "google-vertex-haystack>=5.3.0.post1",
]

[project.scripts]
ast-extractor = "src.components.extractor.ast_extractor:main"
documentation-pipeline = "src.pipelines.documentation_pipeline:main"
query-pipeline = "src.pipelines.query_pipeline:main"
endpoint-clusterer = "src.components.EndpointClusterer:main"
fetch-examples = "src.components.FetchExampleGenerator:main"
query-gen = "src.pipelines.query_generation_pipeline:main"
docgen = "cli.app:app"

[tool.setuptools]
packages = {find = {where = ["."]}}



[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

