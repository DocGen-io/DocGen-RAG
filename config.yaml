# config.yaml

# RAG settings
rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k_retriever: 10
  top_k_reranker: 5
  chunk_size: 500



# General Settings
WEAVIATE_URL: "http://127.0.0.1:8080"
WEAVIATE_API_KEY: null
tracing: true
phoenix_data_dir: "~/.phoenix_data"


# code mapper settings

code_analyzer:
  active_generator: "ollama"
  analyzer_output_path: "analyzer_output"
  dependency_search_top_k: 100


generators:
  ollama:
    url: "http://127.0.0.1:11434"
    api_key: ""
    model: "qwen3.5:4b"
    # model: "llama3"
  gemini:
    url: "https://generativelanguage.googleapis.com/v1beta/"
    api_key: ""
    model: "gemini-2.5-flash"


 
# Documentation Creator settings
doc_creator:
  active_generator: "ollama"
  output_dir: "output"

# Documentation Merger settings
doc_merger:
  api_title: "API Documentation"
  api_version: "1.0.0"
  api_description: "Auto-generated REST API documentation"
  base_url: "http://localhost:3000"

# App settings
app:
  environment: "development"


# AST Extractor settings
ast_extractor:
  save_ast: true
  save_ast_path: "analyzer_output/ast"
  verbose: false

# Tree-sitter query paths
queries:
  general: "queries/general"
  controllers: "queries/controllers-extractors"

# API frameworks supported for documentation
api_frameworks: ["NestJS", "SpringBoot", ".NET"]
languages: ["typescript", "java", "c_sharp"]
