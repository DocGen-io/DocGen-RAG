# config.yaml

# RAG settings
rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k_retriever: 2
  top_k_reranker: 2
  chunk_size: 500
process_grouping_automatically: false

# General Settings
WEAVIATE_URL: "${WEAVIATE_URL}"
WEAVIATE_API_KEY: "${WEAVIATE_API_KEY}"
tracing: true
phoenix_data_dir: "~/.phoenix_data"

# code mapper settings

code_analyzer:
  active_generator: "gemini"
  analyzer_output_path: "analyzer_output"
  dependency_search_top_k: 100

generators:
  ollama:
    url: "http://127.0.0.1:11434"
    api_key: ""
    # model: "qwen3.5:4b"
    # model: "llama3"
    model: "qwen2.5-coder:3b"
    max_tokens: 8192
  gemini:
    project_id: ${GOOGLE_CLOUD_PROJECT}
    location: ${GOOGLE_CLOUD_LOCATION}
    model: "gemini-2.5-flash-lite"
    # model: "gemini-2.5-pro"
    max_tokens: 8192

# Documentation Creator settings
doc_creator:
  active_generator: "gemini"
  output_dir: "output"

# Documentation Merger settings
doc_merger:
  api_title: "API Documentation"
  api_version: "1.0.0"
  api_description: "Auto-generated REST API documentation"
  base_url: "http://localhost:3000"

# App settings
app:
  environment: "development"

# Query Generator settings
query_generator:
  active_generator: "gemini"

# AST Extractor settings
ast_extractor:
  save_ast: true
  save_ast_path: "analyzer_output/ast"
  verbose: false

# Tree-sitter query paths
queries:
  general: "queries/general"
  controllers: "queries/controllers-extractors"
  generated: "queries/generated"

# API frameworks supported for documentation
api_frameworks: ["NestJS", "SpringBoot", ".NET"]
languages: ["typescript", "java", "c_sharp"]
