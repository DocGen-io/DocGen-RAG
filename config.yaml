WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
WEAVIATE_URL: ${WEAVIATE_URL}
api_frameworks:
- NestJS
- SpringBoot
- .NET
app:
  environment: development
ast_extractor:
  save_ast: true
  save_ast_path: analyzer_output/ast
  verbose: true
code_analyzer:
  active_generator: gemini
  analyzer_output_path: analyzer_output
  dependency_search_top_k: 100
doc_creator:
  active_generator: gemini
  output_dir: output
doc_merger:
  api_description: Auto-generated REST API documentation
  api_title: API Documentation
  api_version: 1.0.0
  base_url: http://localhost:3000
generators:
  gemini:
    location: ${GOOGLE_CLOUD_LOCATION}
    max_tokens: 8192
    model: gemini-2.5-flash-lite
    project_id: ${GOOGLE_CLOUD_PROJECT}
  ollama:
    api_key: ''
    max_tokens: 8192
    model: qwen2.5-coder:3b
    url: http://127.0.0.1:11434
languages:
- typescript
- java
- c_sharp
phoenix_data_dir: ~/.phoenix_data
process_grouping_automatically: false
queries:
  controllers: queries/controllers-extractors
  general: queries/general
  generated: queries/generated
query_generator:
  active_generator: gemini
rag:
  active_embedder: gemini
  chunk_size: 500
  embedding_model: gemini-2.5-flash-lite
  top_k_reranker: 2
  top_k_retriever: 2
tracing: true
