# config.yaml

# RAG settings
rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k_retriever: 10
  top_k_reranker: 5
  chunk_size: 500



# General Settings
WEAVIATE_URL: "http://127.0.0.1:8080"
WEAVIATE_API_KEY: null
tracing: false


# code mapper settings


code_mapper:
  mapper_output_path: "mapped_ast.json"
  active_generator: "ollama"
  generators:
    ollama:
      url: "http://127.0.0.1:11434"
      api_key: ""
      model: "llama3"
    gemini:
      url: "https://generativelanguage.googleapis.com/v1beta/"
      api_key: ""
      model: "gemini-2.5-flash"

# Documentation Creator settings
doc_creator:
  active_generator: "ollama"
  generators:
    ollama:
      url: "http://127.0.0.1:11434"
      api_key: ""
      model: "llama3:latest"
    gemini:
      url: "https://generativelanguage.googleapis.com/v1beta/"
      api_key: ""
      model: "gemini-2.5-flash"
  output_dir: "output"

# Documentation Merger settings
doc_merger:
  api_title: "API Documentation"
  api_version: "1.0.0"
  api_description: "Auto-generated REST API documentation"
  base_url: "http://localhost:3000"

# App settings
app:
  environment: "development"

# Environment variables

# AST Extractor settings
ast_extractor:
  verbose: false
  save_ast: true
  save_ast_path: "ast" # folder name where AST will be saved

# Framework settings

# API frameworks supported for documentation
api_frameworks: ["NestJS", "SpringBoot", ".NET"]


queries:
  controllers-extractors: "queries/controllers-extractors/"
  general: "queries/general/"
  imports: "queries/imports/"

  