active_provider: gemini
api_frameworks:
- NestJS
- SpringBoot
- .NET
app:
  environment: development
ast_extractor:
  save_ast: true
  save_ast_path: analyzer_output/ast
  verbose: true
code_analyzer:
  active_generator: gemini
  analyzer_output_path: analyzer_output
  dependency_search_top_k: 100
doc_creator:
  active_generator: gemini
  output_dir: output
doc_merger:
  api_description: Auto-generated REST API documentation
  api_title: API Documentation
  api_version: 1.0.0
  base_url: http://localhost:3000
docker:
  compose_file: docker-compose.yaml
  volume_name: docgen-data
generators:
  gemini:
    max_tokens: 8192
    model: gemini-2.5-flash-lite
  ollama:
    max_tokens: 8192
    model: qwen2.5-coder:3b
    url: http://127.0.0.1:11434
  openai:
    max_tokens: 8192
    model: gpt-4o
languages:
- typescript
- java
- c_sharp
load_dotenv: false
phoenix_data_dir: ~/.phoenix_data
queries:
  controllers: queries/controllers-extractors
  general: queries/general
query_generator:
  active_generator: gemini
rag:
  active_embedder: gemini
  chunk_size: 500
  embedding_model: gemini-2.5-flash-lite
  top_k_reranker: 2
  top_k_retriever: 2
tracing: true
weaviate_url: http://127.0.0.1:8080
